name: Deploy to Production

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The docker-container driver's buildkit daemon runs in its own
          # network namespace by default; it needs to be created with host
          # networking for the "network: host" build step below to actually
          # let the build reach the "mongodb" service on the runner.
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # host networking so the isolated build container can reach the
          # "mongodb" service above, which binds to the runner's localhost
          network: host
          build-args: |
            MONGODB_URI=mongodb://localhost:27017/build
            ADMIN_SESSION_SECRET=build-placeholder
            ADMIN_USERS=[]

  deploy:
    needs: build-and-push
    # Runs on the self-hosted runner installed directly on the production
    # server, so the job executes locally instead of needing an inbound SSH
    # connection from GitHub's runner IPs (blocked by the server's firewall).
    runs-on: self-hosted
    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy
        run: |
          set -e
          cd ${{ secrets.DEPLOY_APP_DIR }}
          docker compose pull app
          docker compose up -d
          docker image prune -f
