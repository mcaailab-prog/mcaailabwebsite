name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build can complete without real secrets.
          # No page in this app queries the DB at build time via generateStaticParams
          # against a live connection; if that changes, real build-time secrets
          # would need to be added here.
          MONGODB_URI: mongodb://localhost:27017/build-placeholder
          ADMIN_SESSION_SECRET: build-placeholder
          ADMIN_USERS: '[]'
          CLOUDINARY_CLOUD_NAME: build-placeholder
          CLOUDINARY_API_KEY: build-placeholder
          CLOUDINARY_API_SECRET: build-placeholder
          EMAIL_HOST: localhost
          EMAIL_PORT: '587'
          EMAIL_USER: build-placeholder
          EMAIL_PASS: build-placeholder
          EMAIL_FROM: build-placeholder@example.com
          ADMIN_EMAIL: build-placeholder@example.com
